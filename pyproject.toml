[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuel-chopper"
version = "0.1.0"
description = "Set a USB-connected iPhone near Australia's best fuel price."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "fuel-chopper contributors" }]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pymobiledevice3==9.36.3",
]

[project.scripts]
fuel-chopper = "fuel_chopper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fuel_chopper"]
